<!DOCTYPE html>
<html lang="zh-Hant">
  <body style="margin:0;padding:24px;background-color:#f3f4f6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#111827;">
    <div style="max-width:600px;margin:0 auto;background-color:#ffffff;border:1px solid #e5e7eb;border-radius:16px;overflow:hidden;">
      <div style="padding:24px 24px 16px 24px;border-bottom:1px solid #e5e7eb;background-color:#f9fafb;">
        <div style="font-size:13px;line-height:20px;color:#6b7280;">{{ briefing.date }}</div>
        <div style="margin-top:6px;font-size:28px;line-height:34px;font-weight:700;color:#111827;">{{ briefing.headline }}</div>
        <div style="margin-top:14px;">
          {% for keyword in briefing.keywords %}
          <span style="display:inline-block;margin:0 8px 8px 0;padding:4px 10px;border-radius:999px;background-color:#f3f4f6;font-size:12px;line-height:18px;color:#6b7280;">{{ keyword }}</span>
          {% endfor %}
        </div>
      </div>
      <div style="padding:24px;">
        {% for section in sections %}
        <div style="margin-bottom:24px;">
          <div style="margin-bottom:10px;font-size:18px;line-height:24px;font-weight:700;color:#111827;">{{ section.label }}</div>
          {% for item in section.entries %}
          <div style="margin-bottom:8px;font-size:15px;line-height:24px;color:#374151;">{{ item | safe }}</div>
          {% endfor %}
        </div>
        {% endfor %}
      </div>
    </div>
  </body>
</html>
