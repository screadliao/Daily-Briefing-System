<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Source Manager</title>
  </head>
  <body style="margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f7fb;color:#111827;">
    <div style="display:flex;min-height:100vh;">
      <aside style="width:240px;border-right:1px solid #dbe2ea;background:#ffffff;padding:20px 16px;box-sizing:border-box;">
        <div style="font-size:20px;font-weight:700;margin-bottom:18px;">Source Manager</div>
        <div id="category-tabs" style="display:flex;flex-direction:column;gap:8px;"></div>
      </aside>
      <main style="flex:1;padding:24px 28px;box-sizing:border-box;">
        <div style="max-width:900px;margin:0 auto;">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px;">
            <div>
              <h1 id="category-title" style="margin:0;font-size:28px;">Sources</h1>
              <div id="category-subtitle" style="margin-top:6px;color:#6b7280;font-size:14px;"></div>
            </div>
            <div id="status" style="font-size:13px;color:#6b7280;"></div>
          </div>

          <div style="background:#ffffff;border:1px solid #dbe2ea;border-radius:16px;padding:20px;">
            <div id="source-list" style="display:flex;flex-direction:column;gap:12px;"></div>

            <div style="margin-top:20px;padding-top:16px;border-top:1px solid #e5e7eb;display:flex;gap:10px;flex-wrap:wrap;">
              <select id="source-type" style="padding:10px 12px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;">
                <option value="feed">feed</option>
                <option value="scrape">scrape</option>
              </select>
              <input
                id="new-url"
                type="url"
                placeholder="https://example.com/rss.xml"
                style="flex:1;min-width:280px;padding:10px 12px;border:1px solid #cbd5e1;border-radius:10px;"
              />
              <button id="add-button" style="padding:10px 16px;border:0;border-radius:10px;background:#111827;color:#fff;cursor:pointer;">
                Add
              </button>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script>
      let sources = {};
      let selectedCategory = "geo";

      async function loadSources() {
        const response = await fetch("/api/sources");
        sources = await response.json();
        if (!sources[selectedCategory]) {
          selectedCategory = Object.keys(sources)[0];
        }
        renderTabs();
        renderCategory();
      }

      function renderTabs() {
        const container = document.getElementById("category-tabs");
        container.innerHTML = "";
        Object.entries(sources).forEach(([key, value]) => {
          const button = document.createElement("button");
          button.textContent = key;
          button.style.cssText = [
            "text-align:left",
            "padding:10px 12px",
            "border-radius:10px",
            "border:1px solid " + (selectedCategory === key ? "#111827" : "#dbe2ea"),
            "background:" + (selectedCategory === key ? "#111827" : "#ffffff"),
            "color:" + (selectedCategory === key ? "#ffffff" : "#111827"),
            "cursor:pointer"
          ].join(";");
          button.onclick = () => {
            selectedCategory = key;
            renderTabs();
            renderCategory();
          };
          container.appendChild(button);
        });
      }

      function renderCategory() {
        const category = sources[selectedCategory];
        document.getElementById("category-title").textContent = selectedCategory;
        document.getElementById("category-subtitle").textContent = category.label;

        const list = document.getElementById("source-list");
        list.innerHTML = "";

        [["feeds", "feed"], ["scrape", "scrape"]].forEach(([bucketKey, type]) => {
          category[bucketKey].forEach((url) => {
            list.appendChild(renderRow(url, type));
          });
        });

        if (!list.children.length) {
          const empty = document.createElement("div");
          empty.textContent = "No sources yet.";
          empty.style.cssText = "padding:16px;border:1px dashed #cbd5e1;border-radius:12px;color:#6b7280;";
          list.appendChild(empty);
        }
      }

      function renderRow(url, type) {
        const wrapper = document.createElement("div");
        wrapper.style.cssText = "border:1px solid #e5e7eb;border-radius:12px;padding:14px;background:#f8fafc;";

        const row = document.createElement("div");
        row.style.cssText = "display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;";

        const text = document.createElement("div");
        text.style.cssText = "flex:1;min-width:280px;";
        text.innerHTML = `
          <div style="display:inline-block;margin-bottom:6px;padding:2px 8px;border-radius:999px;background:#e2e8f0;font-size:12px;color:#475569;">${type}</div>
          <div style="word-break:break-all;font-size:14px;line-height:20px;">${escapeHtml(url)}</div>
        `;

        const actions = document.createElement("div");
        actions.style.cssText = "display:flex;gap:8px;";

        const preview = document.createElement("div");
        preview.style.cssText = "display:none;margin-top:10px;padding:10px 12px;border-radius:10px;background:#ffffff;border:1px solid #dbe2ea;";

        const testButton = document.createElement("button");
        testButton.textContent = "Test";
        testButton.style.cssText = "padding:8px 12px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;cursor:pointer;";
        testButton.onclick = async () => {
          preview.style.display = "block";
          preview.textContent = "Loading...";
          const response = await fetch("/api/test-fetch", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ url })
          });
          const data = await response.json();
          const titles = Array.isArray(data.titles) ? data.titles : [];
          preview.innerHTML = titles.length
            ? titles.map((title) => `<div style="margin-bottom:6px;">${escapeHtml(title)}</div>`).join("")
            : `<div style="color:#6b7280;">No feed items found.</div>`;
        };

        const removeButton = document.createElement("button");
        removeButton.textContent = "Remove";
        removeButton.style.cssText = "padding:8px 12px;border:1px solid #fecaca;border-radius:10px;background:#ef4444;color:#fff;cursor:pointer;";
        removeButton.onclick = async () => {
          await fetch(`/api/sources/${selectedCategory}/remove`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ url })
          });
          setStatus("Source removed.");
          await loadSources();
        };

        actions.appendChild(testButton);
        actions.appendChild(removeButton);
        row.appendChild(text);
        row.appendChild(actions);
        wrapper.appendChild(row);
        wrapper.appendChild(preview);
        return wrapper;
      }

      async function addSource() {
        const input = document.getElementById("new-url");
        const sourceType = document.getElementById("source-type").value;
        const url = input.value.trim();
        if (!url) {
          setStatus("Please enter a URL.");
          return;
        }
        const response = await fetch(`/api/sources/${selectedCategory}/add`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url, type: sourceType })
        });
        if (!response.ok) {
          setStatus("Add failed.");
          return;
        }
        input.value = "";
        setStatus("Source added.");
        await loadSources();
      }

      function setStatus(message) {
        document.getElementById("status").textContent = message;
      }

      function escapeHtml(value) {
        const div = document.createElement("div");
        div.textContent = value;
        return div.innerHTML;
      }

      document.getElementById("add-button").addEventListener("click", addSource);
      document.getElementById("new-url").addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          addSource();
        }
      });

      loadSources();
    </script>
  </body>
</html>
