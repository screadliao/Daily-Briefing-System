name: Daily Briefing

on:
  workflow_dispatch:
    # NOTE: 排程已移到本機 Hermes cron（每日 09:00，取代此 GitHub Actions schedule + email）。
    #       Hermes cron 跑 daily_briefing_discord.sh，本機產 latest.json 並送 Discord embed。
    #       workflow_dispatch 保留供需要時手動觸發（例如雲端重跑）。

jobs:
  briefing:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          DELIVERY_MODE: ""
        run: python main.py

      - name: Prepare deploy directory
        run: |
          mkdir -p _site
          cp preview.html _site/index.html
          cp preview.html _site/$(date -u +%Y-%m-%d).html
          cp latest.txt _site/latest.txt
          cp latest.json _site/latest.json

      - name: Publish preview to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          keep_files: true
